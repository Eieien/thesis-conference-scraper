[project]
name = "conference-scraper"
version = "0.1.0"
description = "Collects CS/tech conference listings (dates, location, deadlines, fees) from multiple sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.45",
    "google-genai>=1.0",
    "rapidfuzz>=3.9",
    "dateparser>=1.2",
    "price-parser>=0.3",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "playwright-stealth>=2.0.3",
    "protego>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
# B008: FastAPI's Depends()/Query() in defaults is the intended pattern.
# SIM905: a split string keeps long code lists compact.
ignore = ["B008", "SIM905"]
